[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "privacy-vision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.10,<6", "torch>=2.6,<3", "ultralytics>=8.4,<9", "pyvirtualcam>=0.11,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
desktop = ["PySide6>=6.8,<7", "pyvirtualcam>=0.11,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src", "."]
